server {
    listen 80;
    server_name pilates.coupleswhobuildtogether.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pilates.coupleswhobuildtogether.com;

    ssl_certificate     /etc/letsencrypt/live/pilates.coupleswhobuildtogether.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pilates.coupleswhobuildtogether.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /var/www/torque-tension/client/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Service worker — must never be cached by the browser
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Exercise photos served from the images directory
    location /images/ {
        alias /var/www/torque-tension/client/public/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API — proxied to Node.js backend
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Vite hashed assets — long cache
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
